name: Stackbar

options:
  bundleIdPrefix: io.github.pmartin-dev
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    version: 1.26.2
  # TCA's macros reference these products in generated client code.
  CasePathsPackage:
    url: https://github.com/pointfreeco/swift-case-paths
    version: 1.10.0
  PerceptionPackage:
    url: https://github.com/pointfreeco/swift-perception
    version: 2.0.12
  DependenciesPackage:
    url: https://github.com/pointfreeco/swift-dependencies
    version: 1.17.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_IDENTITY: "-"

targets:
  Stackbar:
    type: application
    platform: macOS
    sources:
      - path: Stackbar
        excludes:
          - App/Info.plist
    info:
      path: Stackbar/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pmartin-dev.stackbar
        PRODUCT_NAME: Stackbar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: StackbarProcessHost
        embed: true
        link: false
        copy:
          destination: executables
          subpath: Helpers
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: CasePathsPackage
        product: CasePaths
      - package: PerceptionPackage
        product: PerceptionCore
      - package: DependenciesPackage
        product: Dependencies

  StackbarProcessHost:
    type: tool
    platform: macOS
    sources:
      - path: StackbarProcessHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pmartin-dev.stackbar.process-host

  StackbarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StackbarTests
    dependencies:
      - target: StackbarProcessHost
        embed: true
        link: false
        copy:
          destination: executables
      - target: Stackbar
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: CasePathsPackage
        product: CasePaths
      - package: PerceptionPackage
        product: PerceptionCore
      - package: DependenciesPackage
        product: Dependencies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pmartin-dev.stackbar.tests
        GENERATE_INFOPLIST_FILE: YES

  StackbarUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: StackbarUITests
    dependencies:
      - target: Stackbar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pmartin-dev.stackbar.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Stackbar

schemes:
  Stackbar:
    build:
      targets:
        Stackbar: all
        StackbarTests: [test]
        StackbarUITests: [test]
    test:
      targets:
        - StackbarTests
        - StackbarUITests
